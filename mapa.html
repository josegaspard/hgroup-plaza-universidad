    <style>
        :root{
            --plaza-black:#1a1a2e; --plaza-purple:#6B2D8B; --plaza-gold:#C9A96E; --plaza-cream:#F5F1EB;
            --nav-h:80px;
        }
        *{ box-sizing:border-box; }
        body { font-family:'Lato',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; height:100vh; margin:0; background:#fff; }

        /* ===== LAYOUT ===== */
        .map-wrapper{ margin-top:var(--nav-h); height:calc(100vh - var(--nav-h)); display:flex; overflow:hidden; }

        /* SIDEBAR */
        .map-sidebar{ width:320px; flex-shrink:0; background:#fff; border-right:1px solid #ececec; display:flex; flex-direction:column; overflow:hidden; }
        .sb-head{ background:var(--plaza-black); padding:22px 24px; }
        .sb-search{ padding:14px 18px; border-bottom:1px solid #f0f0f0; }
        .sb-search input{ width:100%; border:none; border-bottom:1px solid #e3e3e3; padding:9px 4px; font-family:'Playfair Display',serif; font-style:italic; font-size:15px; color:var(--plaza-black); outline:none; transition:border-color .25s; background:transparent; }
        .sb-search input:focus{ border-color:var(--plaza-gold); }
        .store-list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
        .store-list::-webkit-scrollbar{ width:4px; } .store-list::-webkit-scrollbar-thumb{ background:#d6d6d6; border-radius:4px; }
        .sl-item{ display:flex; align-items:center; gap:13px; padding:12px 20px; cursor:pointer; border-bottom:1px solid #f4f4f4; transition:background .2s, padding-left .2s; position:relative; }
        .sl-item::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:0; background:var(--plaza-purple); transition:width .2s; }
        .sl-item:hover,.sl-item.active{ background:#faf7ff; padding-left:26px; }
        .sl-item:hover::before,.sl-item.active::before{ width:4px; }
        .sl-num{ flex-shrink:0; width:34px; height:34px; border-radius:50%; background:var(--plaza-cream); color:var(--plaza-purple); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; letter-spacing:.02em; }
        .sl-item.vacant .sl-num{ background:#f1f1f1; color:#bbb; }
        .sl-name{ font-size:13px; color:#2c2c2c; line-height:1.2; }
        .sl-cat{ font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:#9a9a9a; margin-top:2px; }
        .sl-empty{ padding:34px 22px; text-align:center; color:#cfcfcf; }

        /* MAP CANVAS */
        .map-canvas{ flex:1; position:relative; background:radial-gradient(120% 120% at 50% 0%, #fbf9f5 0%, #f3eee6 100%); overflow:hidden; }
        .floor-viewport{ position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
        .floor-viewport.grabbing{ cursor:grabbing; }
        .floor-stage{ position:absolute; inset:18px; display:none; }
        .floor-stage.active{ display:block; }
        .floor-fit{ position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
        .floor-base{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; -webkit-user-drag:none; -webkit-user-select:none; user-select:none; }
        .floor-zones{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
        .floor-zones rect.zone{ pointer-events:all; cursor:pointer; fill:rgba(107,45,139,0); stroke:rgba(107,45,139,0); stroke-width:2.5; transition:fill .18s, stroke .18s; }
        .floor-viewport.hint-zones .floor-zones rect.zone{ fill:rgba(201,169,110,.10); stroke:rgba(201,169,110,.45); }
        .floor-zones rect.zone:hover{ fill:rgba(107,45,139,.20); stroke:var(--plaza-purple); }
        .floor-zones rect.zone.vacant:hover{ fill:rgba(150,150,150,.16); stroke:#9a9a9a; }
        .floor-zones rect.zone.sel{ fill:rgba(201,169,110,.30); stroke:var(--plaza-gold); }

        /* FLOOR SWITCH (pill, siempre visible) */
        .floor-switch{ position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:22; display:flex; align-items:center; gap:6px; background:rgba(26,26,46,.94); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); padding:7px 8px 7px 16px; border-radius:60px; box-shadow:0 12px 34px rgba(0,0,0,.26); max-width:calc(100% - 28px); }
        .fs-head{ color:#fff; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.18em; opacity:.65; margin-right:4px; white-space:nowrap; }
        .fs-btn{ font-family:'Lato',sans-serif; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.6); background:transparent; border:none; cursor:pointer; padding:8px 14px; border-radius:40px; transition:color .2s, background .2s; white-space:nowrap; }
        .fs-btn:hover{ color:#fff; }
        .fs-btn.active{ color:#fff; background:var(--plaza-purple); }

        /* ZOOM CONTROLS */
        .zoom-ctrl{ position:absolute; right:16px; bottom:64px; z-index:20; display:flex; flex-direction:column; gap:8px; }
        .zoom-ctrl button{ width:42px; height:42px; border-radius:12px; border:1px solid #e7e1d6; background:rgba(255,255,255,.95); color:var(--plaza-black); font-size:16px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.10); transition:background .2s, transform .1s; display:flex; align-items:center; justify-content:center; }
        .zoom-ctrl button:hover{ background:#fff; color:var(--plaza-purple); }
        .zoom-ctrl button:active{ transform:scale(.94); }

        /* HINT BAR */
        .hint-bar{ position:absolute; bottom:0; left:0; right:0; z-index:15; background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-top:1px solid #ece6db; padding:9px 18px; display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; }
        .hint-bar .h-tip{ font-size:11px; color:#8a8275; letter-spacing:.02em; }
        .hint-bar .h-tip i{ color:var(--plaza-purple); margin-right:5px; }
        .hint-bar .h-sym{ font-size:10px; color:#9a9a9a; text-transform:uppercase; letter-spacing:.1em; display:flex; align-items:center; gap:5px; }
        .hint-bar .h-sym i{ color:var(--plaza-gold); }

        /* DETAIL PANEL */
        .detail{ position:absolute; top:0; right:0; height:100%; width:340px; max-width:88vw; background:#fff; box-shadow:-18px 0 50px rgba(0,0,0,.16); z-index:30; transform:translateX(102%); transition:transform .35s cubic-bezier(.22,.9,.3,1); display:flex; flex-direction:column; }
        .detail.open{ transform:translateX(0); }
        .detail-close{ position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%; border:none; background:#f3f0ea; color:#555; cursor:pointer; font-size:15px; z-index:2; }
        .detail-close:hover{ background:var(--plaza-purple); color:#fff; }
        .detail-logo{ height:190px; flex-shrink:0; background:var(--plaza-cream); display:flex; align-items:center; justify-content:center; padding:30px; border-bottom:1px solid #efe9df; }
        .detail-logo img{ max-width:78%; max-height:78%; object-fit:contain; }
        .detail-logo .ph{ font-family:'Playfair Display',serif; font-size:54px; color:#cdbfa6; }
        .detail-body{ padding:26px 26px 30px; overflow-y:auto; }
        .detail-cat{ font-size:10px; text-transform:uppercase; letter-spacing:.22em; color:var(--plaza-gold); font-weight:700; }
        .detail-name{ font-family:'Playfair Display',serif; font-size:27px; line-height:1.1; color:var(--plaza-black); margin:6px 0 18px; }
        .detail-meta{ display:flex; gap:10px; margin-bottom:22px; }
        .detail-meta .chip{ flex:1; background:#faf8f3; border:1px solid #efe9df; border-radius:12px; padding:12px; text-align:center; }
        .detail-meta .chip .k{ font-size:9px; text-transform:uppercase; letter-spacing:.14em; color:#a59f93; }
        .detail-meta .chip .v{ font-size:15px; font-weight:700; color:var(--plaza-black); margin-top:3px; }
        .detail-cta{ display:block; text-align:center; background:var(--plaza-purple); color:#fff; text-decoration:none; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.14em; padding:14px; border-radius:40px; transition:background .2s; }
        .detail-cta:hover{ background:#56236f; }
        .detail-hours{ margin-top:16px; font-size:12px; color:#8a8275; text-align:center; }
        .detail-hours i{ color:var(--plaza-gold); margin-right:6px; }

        /* MOBILE */
        @media (max-width:860px){
            :root{ --nav-h:72px; }
            body{ overflow:auto; height:auto; }
            .map-wrapper{ flex-direction:column; height:auto; min-height:calc(100vh - var(--nav-h)); }
            .map-canvas{ order:1; height:62vh; min-height:380px; flex:none; }
            .map-sidebar{ order:2; width:100%; border-right:none; border-top:1px solid #ececec; max-height:none; }
            .store-list{ max-height:46vh; }
            .floor-switch{ top:10px; left:10px; right:10px; transform:none; max-width:none; justify-content:space-between; padding:6px 8px; }
            .fs-head{ display:none; }
            .fs-btn{ flex:1; text-align:center; padding:9px 4px; font-size:10px; }
            .detail{ width:100%; max-width:100%; top:auto; bottom:0; height:auto; max-height:82%; border-radius:22px 22px 0 0; transform:translateY(102%); }
            .detail.open{ transform:translateY(0); }
            .zoom-ctrl{ bottom:58px; right:10px; }
            .hint-bar{ gap:10px; padding:8px 12px; }
            .hint-bar .h-sym{ display:none; }
        }
    </style>
</head>

    <main>
        <div class="map-wrapper">

            <!-- SIDEBAR -->
            <aside class="map-sidebar">
                <div class="sb-head">
                    <h1 class="text-2xl md:text-3xl font-serif text-white leading-none mb-1">Mapa</h1>
                    <p class="text-[11px] text-gray-400 uppercase tracking-[0.2em]">Haz clic en un local</p>
                </div>
                <div class="sb-search">
                    <input id="search-store" type="text" placeholder="Buscar tienda o local…" autocomplete="off">
                </div>
                <div class="store-list" id="store-list"></div>
            </aside>

            <!-- CANVAS -->
            <div class="map-canvas">

                <!-- Floor switch -->
                <div class="floor-switch" id="floor-switch" role="tablist" aria-label="Nivel">
                    <span class="fs-head"><i class="fa-solid fa-layer-group"></i> Nivel</span>
                    <button class="fs-btn active" data-floor="planta_baja" role="tab">Planta Baja</button>
                    <button class="fs-btn" data-floor="mezzanine" role="tab">Mezzanine</button>
                    <button class="fs-btn" data-floor="sotano" role="tab">Sótano</button>
                </div>

                <!-- Viewport -->
                <div class="floor-viewport hint-zones" id="viewport">
                    <!-- floor stages se inyectan por JS -->
                </div>

                <!-- Zoom controls -->
                <div class="zoom-ctrl">
                    <button id="zin" title="Acercar" aria-label="Acercar"><i class="fa-solid fa-plus"></i></button>
                    <button id="zout" title="Alejar" aria-label="Alejar"><i class="fa-solid fa-minus"></i></button>
                    <button id="zreset" title="Restablecer" aria-label="Restablecer"><i class="fa-solid fa-expand"></i></button>
                </div>

                <!-- Hint bar -->
                <div class="hint-bar">
                    <span class="h-tip" id="hint-text"><i class="fa-solid fa-up-down-left-right"></i>Arrastra para mover · rueda para acercar · clic en un local</span>
                    <span class="h-sym"><i class="fa-solid fa-elevator"></i> Elevador</span>
                    <span class="h-sym"><i class="fa-solid fa-stairs"></i> Escaleras</span>
                    <span class="h-sym"><i class="fa-solid fa-restroom"></i> Sanitarios</span>
                </div>

                <!-- Detail panel -->
                <aside class="detail" id="detail" aria-live="polite">
                    <button class="detail-close" id="detail-close" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
                    <div class="detail-logo" id="detail-logo"></div>
                    <div class="detail-body">
                        <div class="detail-cat" id="detail-cat"></div>
                        <div class="detail-name" id="detail-name"></div>
                        <div class="detail-meta">
                            <div class="chip"><div class="k">Local</div><div class="v" id="detail-local"></div></div>
                            <div class="chip"><div class="k">Nivel</div><div class="v" id="detail-floor"></div></div>
                        </div>
                        <a class="detail-cta" id="detail-cta" href="directorio.html"><i class="fa-solid fa-store mr-1"></i> Ver en directorio</a>
                        <div class="detail-hours"><i class="fa-regular fa-clock"></i> 11:00 – 21:00 hrs</div>
                    </div>
                </aside>

            </div>
        </div>

        var DATA = JSON.parse(document.getElementById('mapdata').textContent);
        var VB = DATA.vb;                         // [0,0,W,H]
        var ASSET_V = 'v3';                        // cache-buster de los SVG base
        var FLOORS = ['planta_baja','mezzanine','sotano'];
        var current = 'planta_baja';
        var view = {};                             // estado pan/zoom por piso
        var fitEls = {}, zoneEls = {};

        var viewport = document.getElementById('viewport');

        /* ---------- construir las stages (img base + svg zonas) ---------- */
        FLOORS.forEach(function(fid){
            var f = DATA.floors[fid];
            var stage = document.createElement('div');
            stage.className = 'floor-stage' + (fid===current?' active':'');
            stage.dataset.floor = fid;

            var fit = document.createElement('div');
            fit.className = 'floor-fit';

            var img = document.createElement('img');
            img.className = 'floor-base';
            img.alt = 'Plano ' + f.label + ' — Plaza Universidad';
            img.src = 'images/' + f.base + '?' + ASSET_V;
            img.loading = (fid===current ? 'eager' : 'lazy');
            fit.appendChild(img);

            var ns='http://www.w3.org/2000/svg';
            var svg = document.createElementNS(ns,'svg');
            svg.setAttribute('class','floor-zones');
            svg.setAttribute('viewBox', VB.join(' '));
            svg.setAttribute('preserveAspectRatio','xMidYMid meet');

            f.zones.forEach(function(z){
                var st = DATA.stores[fid+':'+z.n] || {name:'Disponible',cat:'Local',img:''};
                var vacant = (st.name==='Disponible');
                var r = document.createElementNS(ns,'rect');
                r.setAttribute('class','zone'+(vacant?' vacant':''));
                r.setAttribute('x',z.x); r.setAttribute('y',z.y);
                r.setAttribute('width',z.w); r.setAttribute('height',z.h);
                r.setAttribute('rx','7'); r.setAttribute('ry','7');
                r.dataset.local = z.n; r.dataset.floor = fid;
                r.dataset.name = st.name; r.dataset.cat = st.cat; r.dataset.img = st.img||'';
                var t=document.createElementNS(ns,'title');
                t.textContent = (vacant?('Local '+z.n+' · Disponible'):(st.name+' · Local '+z.n));
                r.appendChild(t);
                svg.appendChild(r);
            });
            fit.appendChild(svg);
            stage.appendChild(fit);
            viewport.appendChild(stage);

            fitEls[fid]=fit; zoneEls[fid]=svg;
            view[fid]={s:1,tx:0,ty:0};
        });

        function applyTransform(fid){
            var v=view[fid];
            fitEls[fid].style.transform='translate('+v.tx+'px,'+v.ty+'px) scale('+v.s+')';
        }
        function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

        /* ---------- pan + zoom ---------- */
        var MINS=1, MAXS=6;
        function zoomAt(fid, factor, cx, cy){
            var v=view[fid];
            var rect=viewport.getBoundingClientRect();
            var px=(cx!=null?cx:rect.width/2), py=(cy!=null?cy:rect.height/2);
            var ns=clamp(v.s*factor, MINS, MAXS);
            var k=ns/v.s;
            // mantener el punto bajo el cursor
            v.tx = px - k*(px - v.tx);
            v.ty = py - k*(py - v.ty);
            v.s = ns;
            constrain(fid);
            applyTransform(fid);
        }
        function constrain(fid){
            var v=view[fid];
            if(v.s<=MINS){ v.s=MINS; }
            var rect=viewport.getBoundingClientRect();
            var maxx=rect.width*(v.s-1), maxy=rect.height*(v.s-1);
            v.tx=clamp(v.tx, -maxx, 0);
            v.ty=clamp(v.ty, -maxy, 0);
        }

        // wheel
        viewport.addEventListener('wheel', function(e){
            e.preventDefault();
            var rect=viewport.getBoundingClientRect();
            var f = e.deltaY<0 ? 1.12 : 1/1.12;
            zoomAt(current, f, e.clientX-rect.left, e.clientY-rect.top);
        }, {passive:false});

        // pointers (drag + pinch)
        var pointers=new Map(), dragMoved=false, startDist=0, startMid=null, startS=1, panStart=null;
        viewport.addEventListener('pointerdown', function(e){
            if(e.target.closest('.detail')) return;
            viewport.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
            dragMoved=false;
            if(pointers.size===1){
                var v=view[current]; panStart={x:e.clientX,y:e.clientY,tx:v.tx,ty:v.ty};
                viewport.classList.add('grabbing');
            } else if(pointers.size===2){
                var p=[...pointers.values()];
                startDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
                var rect=viewport.getBoundingClientRect();
                startMid={x:(p[0].x+p[1].x)/2-rect.left,y:(p[0].y+p[1].y)/2-rect.top};
                startS=view[current].s;
            }
        });
        viewport.addEventListener('pointermove', function(e){
            if(!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
            if(pointers.size===2){
                var p=[...pointers.values()];
                var d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
                if(startDist>0){
                    var v=view[current];
                    var target=clamp(startS*(d/startDist),MINS,MAXS);
                    var k=target/v.s;
                    v.tx=startMid.x-k*(startMid.x-v.tx);
                    v.ty=startMid.y-k*(startMid.y-v.ty);
                    v.s=target; constrain(current); applyTransform(current);
                }
                dragMoved=true;
            } else if(pointers.size===1 && panStart){
                var dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
                if(Math.abs(dx)>4||Math.abs(dy)>4) dragMoved=true;
                var v=view[current];
                v.tx=panStart.tx+dx; v.ty=panStart.ty+dy;
                constrain(current); applyTransform(current);
            }
        });
        function endPointer(e){
            pointers.delete(e.pointerId);
            if(pointers.size<2){ startDist=0; }
            if(pointers.size===0){ panStart=null; viewport.classList.remove('grabbing'); }
        }
        viewport.addEventListener('pointerup', endPointer);
        viewport.addEventListener('pointercancel', endPointer);

        /* ---------- click en zona ---------- */
        viewport.addEventListener('click', function(e){
            var r=e.target.closest('rect.zone');
            if(!r) return;
            if(dragMoved) return;
            selectZone(r.dataset.floor, r.dataset.local, true);
        });

        /* ---------- selección + panel ---------- */
        var selRect=null;
        function clearSel(){ if(selRect){ selRect.classList.remove('sel'); selRect=null; } }
        function findRect(fid,n){ return zoneEls[fid].querySelector('rect.zone[data-local="'+n+'"]'); }

        function openDetail(d){
            var vacant = (d.name==='Disponible');
            var logo=document.getElementById('detail-logo');
            if(!vacant && d.img){ logo.innerHTML='<img src="'+d.img+'" alt="'+escapeHtml(d.name)+'">'; }
            else { logo.innerHTML='<span class="ph">'+(vacant?'<i class="fa-regular fa-square-plus"></i>':escapeHtml((d.name||'?').charAt(0)))+'</span>'; }
            document.getElementById('detail-cat').textContent = vacant?'Local disponible':d.cat;
            document.getElementById('detail-name').textContent = vacant?('Local '+d.local):d.name;
            document.getElementById('detail-local').textContent = d.local;
            document.getElementById('detail-floor').textContent = DATA.floors[d.floor].label;
            var cta=document.getElementById('detail-cta');
            if(vacant){ cta.innerHTML='<i class="fa-solid fa-envelope mr-1"></i> Consultar disponibilidad'; cta.href='contacto.html'; }
            else { cta.innerHTML='<i class="fa-solid fa-store mr-1"></i> Ver en directorio'; cta.href='directorio.html'; }
            document.getElementById('detail').classList.add('open');
        }
        function selectZone(fid, n, focus){
            if(fid!==current) switchFloor(fid);
            clearSel();
            var r=findRect(fid,n);
            if(r){ r.classList.add('sel'); selRect=r; }
            var st=DATA.stores[fid+':'+n]||{name:'Disponible',cat:'Local',img:''};
            openDetail({name:st.name,cat:st.cat,img:st.img,local:n,floor:fid});
            // sync sidebar
            document.querySelectorAll('.sl-item').forEach(function(el){ el.classList.toggle('active', el.dataset.floor===fid && el.dataset.local===String(n)); });
            try{ history.replaceState(null,'', '#'+fid+':'+n); }catch(e){}
            if(focus) centerOnZone(fid,n);
        }
        function centerOnZone(fid,n){
            var z=DATA.floors[fid].zones.find(function(x){return x.n==n;});
            if(!z) return;
            var v=view[fid]; var rect=viewport.getBoundingClientRect();
            // posición del centro de la zona en px (a escala 1, dentro del fit con object-fit contain)
            var fit=fitEls[fid].getBoundingClientRect();
            // mapear coords viewBox -> px del fit (contain)
            var scale=Math.min(fit.width/VB[2], fit.height/VB[3]);
            var offx=(fit.width - VB[2]*scale)/2, offy=(fit.height - VB[3]*scale)/2;
            var zx=offx+z.cx*scale, zy=offy+z.cy*scale;   // px dentro del fit a escala base
            var target=Math.max(v.s, 2.2);
            v.s=clamp(target,MINS,MAXS);
            v.tx = rect.width/2 - v.s*zx;
            v.ty = rect.height/2 - v.s*zy;
            constrain(fid); applyTransform(fid);
        }
        document.getElementById('detail-close').addEventListener('click', function(){
            document.getElementById('detail').classList.remove('open'); clearSel();
            document.querySelectorAll('.sl-item.active').forEach(function(el){el.classList.remove('active');});
        });

        /* ---------- floor switch ---------- */
        function switchFloor(fid){
            if(fid===current) return;
            current=fid;
            FLOORS.forEach(function(f){
                viewport.querySelector('.floor-stage[data-floor="'+f+'"]').classList.toggle('active', f===fid);
            });
            document.querySelectorAll('.fs-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.floor===fid); });
            buildList(fid);
            clearSel();
            // lazy-eager el img del piso activo
            var img=fitEls[fid].querySelector('img'); if(img) img.loading='eager';
            applyTransform(fid);
        }
        document.querySelectorAll('.fs-btn').forEach(function(b){
            b.addEventListener('click', function(){ switchFloor(b.dataset.floor); });
        });

        /* ---------- zoom buttons ---------- */
        document.getElementById('zin').addEventListener('click', function(){ zoomAt(current,1.4); });
        document.getElementById('zout').addEventListener('click', function(){ zoomAt(current,1/1.4); });
        document.getElementById('zreset').addEventListener('click', function(){ view[current]={s:1,tx:0,ty:0}; applyTransform(current); });

        /* ---------- sidebar list ---------- */
        function storesOfFloor(fid){
            return DATA.floors[fid].zones.map(function(z){
                var st=DATA.stores[fid+':'+z.n]||{name:'Disponible',cat:'Local',img:''};
                return {n:z.n,name:st.name,cat:st.cat,vacant:st.name==='Disponible'};
            }).sort(function(a,b){
                if(a.vacant!==b.vacant) return a.vacant?1:-1;
                return a.name.localeCompare(b.name,'es');
            });
        }
        function buildList(fid, filter){
            var list=document.getElementById('store-list');
            var items=storesOfFloor(fid);
            if(filter){ var q=filter.toLowerCase(); items=items.filter(function(it){ return it.name.toLowerCase().indexOf(q)>=0 || String(it.n)===q; }); }
            if(!items.length){ list.innerHTML='<div class="sl-empty"><i class="fa-regular fa-face-frown text-2xl block mb-2 opacity-40"></i><p class="text-xs uppercase tracking-widest">Sin resultados</p></div>'; return; }
            list.innerHTML=items.map(function(it){
                return '<div class="sl-item'+(it.vacant?' vacant':'')+'" data-floor="'+fid+'" data-local="'+it.n+'">'
                    +'<span class="sl-num">'+it.n+'</span>'
                    +'<div><div class="sl-name">'+escapeHtml(it.vacant?('Local '+it.n):it.name)+'</div>'
                    +'<div class="sl-cat">'+escapeHtml(it.vacant?'Disponible':it.cat)+'</div></div></div>';
            }).join('');
        }
        // delegación lista
        document.getElementById('store-list').addEventListener('click', function(e){
            var it=e.target.closest('.sl-item'); if(!it) return;
            selectZone(it.dataset.floor, it.dataset.local, true);
        });
        document.getElementById('store-list').addEventListener('mouseover', function(e){
            var it=e.target.closest('.sl-item'); if(!it) return;
            var r=findRect(it.dataset.floor, it.dataset.local); if(r && !r.classList.contains('sel')) r.style.fill='rgba(107,45,139,.18)';
        });
        document.getElementById('store-list').addEventListener('mouseout', function(e){
            var it=e.target.closest('.sl-item'); if(!it) return;
            var r=findRect(it.dataset.floor, it.dataset.local); if(r && !r.classList.contains('sel')) r.style.fill='';
        });

        /* ---------- search (busca en TODOS los pisos) ---------- */
        var searchBox=document.getElementById('search-store');
        searchBox.addEventListener('input', function(){
            var q=this.value.trim();
            if(!q){ buildList(current); return; }
            // buscar match en cualquier piso
            var ql=q.toLowerCase(), hit=null;
            for(var i=0;i<FLOORS.length && !hit;i++){
                var fid=FLOORS[i];
                DATA.floors[fid].zones.forEach(function(z){
                    if(hit) return;
                    var st=DATA.stores[fid+':'+z.n]; if(!st||st.name==='Disponible') return;
                    if(st.name.toLowerCase().indexOf(ql)>=0) hit={fid:fid,n:z.n};
                });
            }
            buildList(current, q);
        });
        searchBox.addEventListener('keydown', function(e){
            if(e.key!=='Enter') return;
            var q=this.value.trim().toLowerCase(); if(!q) return;
            for(var i=0;i<FLOORS.length;i++){
                var fid=FLOORS[i], found=null;
                DATA.floors[fid].zones.forEach(function(z){
                    if(found) return;
                    var st=DATA.stores[fid+':'+z.n]; if(!st||st.name==='Disponible') return;
                    if(st.name.toLowerCase().indexOf(q)>=0 || String(z.n)===q) found=z.n;
                });
                if(found){ selectZone(fid,found,true); break; }
            }
        });

        /* ---------- util ---------- */
        function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

        /* ---------- hint texto según dispositivo + auto-ocultar resaltado ---------- */
        if(matchMedia('(pointer:coarse)').matches){
            document.getElementById('hint-text').innerHTML='<i class="fa-solid fa-hand-pointer"></i>Pellizca para acercar · arrastra · toca un local';
        }
        // quitar el resaltado permanente de zonas tras unos segundos (queda al hover)
        setTimeout(function(){ viewport.classList.remove('hint-zones'); }, 4200);

        window.addEventListener('resize', function(){ FLOORS.forEach(function(f){ constrain(f); applyTransform(f); }); });

        /* init */
        buildList(current);
        applyTransform(current);

        /* deep-link por hash: #planta_baja:4 ó #pb-4 -> abre ese local (compartible) */
        function openFromHash(){
            var h=(location.hash||'').replace('#','');
            var m=h.match(/^([a-z_]+)[:\-](\d+)$/i);
            if(!m) return;
            var fid=m[1].toLowerCase();
            if(fid==='pb') fid='planta_baja'; if(fid==='mz'||fid==='mezz') fid='mezzanine'; if(fid==='st') fid='sotano';
            if(DATA.floors[fid] && DATA.floors[fid].zones.some(function(z){return z.n==m[2];})){
                setTimeout(function(){ selectZone(fid, parseInt(m[2],10), true); }, 300);
            }
        }
        window.addEventListener('hashchange', openFromHash);
        openFromHash();
    })();

    function toggleMobileMenu(){
        var menu=document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
        setTimeout(function(){ menu.classList.toggle('opacity-0'); },10);
        document.body.style.overflow = menu.classList.contains('hidden') ? '' : 'hidden';
    }
    </script>
