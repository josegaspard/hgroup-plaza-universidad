<!-- ESTACIONAMIENTO NIVEL — Plaza Universidad -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870"
     font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Mapa Estacionamiento Nivel Plaza Universidad">
<defs>
  <style>
    .z { cursor:pointer; transition:opacity .2s,filter .2s; }
    .z:hover { opacity:.8; filter:brightness(.93); }
    .al { font-size:18px; font-weight:700; fill:#1a1a1a; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
    .sl { font-size:9px; font-weight:700; fill:#333; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
    .cl { font-size:7.5px; fill:#777; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
  </style>
</defs>

<!-- Fondo exterior -->
<rect width="1200" height="870" fill="#d0ccc0"/>
<rect x="0" y="820" width="1200" height="50" fill="#c0bdb4"/>
<text x="600" y="848" style="font-size:10px;fill:#888;text-anchor:middle;letter-spacing:3;font-weight:600">AV. UNIVERSIDAD</text>
<rect x="0" y="0" width="42" height="820" fill="#c0bdb4"/>
<rect x="1158" y="0" width="42" height="870" fill="#c0bdb4"/>

<!-- Contorno mall -->
<polygon points="42,42 1158,42 1158,820 42,820" fill="#edeae0" stroke="#888" stroke-width="2"/>

<!-- ZONA ESTACIONAMIENTO norte (área grande superior) -->
<rect x="44" y="44" width="1112" height="310" rx="3" fill="#cfd8dc"/>
<text x="600" y="195" style="font-size:16px;fill:#607d8b;text-anchor:middle;font-weight:600;letter-spacing:2">ESTACIONAMIENTO</text>
<text x="600" y="218" style="font-size:11px;fill:#90a4ae;text-anchor:middle;letter-spacing:1">Nivel Superior — Zonas A, B, C, D</text>
<!-- Filas de cajones de estacionamiento decorativas -->
<line x1="100" y1="100" x2="1100" y2="100" stroke="#b0bec5" stroke-width="1" stroke-dasharray="8,4"/>
<line x1="100" y1="140" x2="1100" y2="140" stroke="#b0bec5" stroke-width="1" stroke-dasharray="8,4"/>
<line x1="100" y1="180" x2="1100" y2="180" stroke="#b0bec5" stroke-width="1" stroke-dasharray="8,4"/>
<line x1="100" y1="220" x2="1100" y2="220" stroke="#b0bec5" stroke-width="1" stroke-dasharray="8,4"/>
<line x1="100" y1="260" x2="1100" y2="260" stroke="#b0bec5" stroke-width="1" stroke-dasharray="8,4"/>
<line x1="100" y1="300" x2="1100" y2="300" stroke="#b0bec5" stroke-width="1" stroke-dasharray="8,4"/>
<!-- Divisiones verticales cajones -->
<line x1="200" y1="78" x2="200" y2="316" stroke="#b0bec5" stroke-width=".5"/>
<line x1="360" y1="78" x2="360" y2="316" stroke="#b0bec5" stroke-width=".5"/>
<line x1="520" y1="78" x2="520" y2="316" stroke="#b0bec5" stroke-width=".5"/>
<line x1="680" y1="78" x2="680" y2="316" stroke="#b0bec5" stroke-width=".5"/>
<line x1="840" y1="78" x2="840" y2="316" stroke="#b0bec5" stroke-width=".5"/>
<line x1="1000" y1="78" x2="1000" y2="316" stroke="#b0bec5" stroke-width=".5"/>
<!-- Flechas de circulación -->
<text x="140" y="330" style="font-size:9px;fill:#78909c;text-anchor:middle">↑ Entrada A</text>
<text x="440" y="330" style="font-size:9px;fill:#78909c;text-anchor:middle">↑ Entrada B</text>
<text x="760" y="330" style="font-size:9px;fill:#78909c;text-anchor:middle">↑ Entrada C</text>
<text x="1060" y="330" style="font-size:9px;fill:#78909c;text-anchor:middle">↑ Entrada D</text>

<!-- ZONA DE ACCESO (circulación intermedia) -->
<rect x="44" y="354" width="580" height="60" rx="2" fill="#e0dbd2"/>
<text x="334" y="384" style="font-size:9px;fill:#888;text-anchor:middle;letter-spacing:2">ACCESO PEATONAL — ESCALERAS / ELEVADORES</text>

<!-- SEARS segundo nivel -->
<a href="../../directorio.html?tienda=Sears" target="_top">
  <rect x="628" y="354" width="524" height="428" rx="4" fill="#FFE94D" stroke="#e6c900" stroke-width="1.5" class="z"/>
  <text x="890" y="558" class="al" style="font-size:26px">SEARS</text>
  <text x="890" y="590" class="cl" style="font-size:11px">Estacionamiento Nivel</text>
  <title>Sears — Estacionamiento Nivel</title>
</a>

<!-- ZONA SERVICIOS / SALON DE FIESTAS izquierda -->
<rect x="44" y="418" width="580" height="364" rx="3" fill="#e8e3d8" stroke="#ccc" stroke-width="1"/>
<text x="334" y="560" style="font-size:13px;fill:#888;text-anchor:middle;font-weight:600">SERVICIO AL PORTAL</text>
<text x="334" y="580" style="font-size:10px;fill:#aaa;text-anchor:middle">Estacionamiento · Accesos</text>

<!-- Zona de estacionamiento VIP / especial (izquierda inferior) -->
<rect x="60" y="620" width="240" height="150" rx="3" fill="#d5cfc5" stroke="#bbb" stroke-width="1" stroke-dasharray="6,3"/>
<text x="180" y="693" style="font-size:10px;fill:#999;text-anchor:middle;font-weight:600">ESTACIONAMIENTO</text>
<text x="180" y="710" style="font-size:10px;fill:#999;text-anchor:middle">VIP</text>

<!-- Escalera y acceso a Planta Baja -->
<rect x="310" y="620" width="120" height="60" rx="3" fill="#b8c9de"/>
<text x="370" y="650" style="font-size:9px;fill:#607d8b;text-anchor:middle;font-weight:600">ESCALERA</text>
<text x="370" y="663" style="font-size:8px;fill:#78909c;text-anchor:middle">↓ Planta Baja</text>

<!-- Leyenda -->
<rect x="44" y="44" width="0" height="0"/>
<rect x="1010" y="44" width="144" height="140" rx="6" fill="white" opacity=".93" stroke="#ccc" stroke-width="1"/>
<text x="1020" y="64" style="font-size:9px;font-weight:700;fill:#333;letter-spacing:1">LEYENDA</text>
<rect x="1020" y="72" width="11" height="10" fill="#FFE94D" stroke="#ccc" stroke-width=".5"/>
<text x="1035" y="81" style="font-size:8px;fill:#555">Rentado / Operando</text>
<rect x="1020" y="88" width="11" height="10" fill="#cfd8dc" stroke="#ccc" stroke-width=".5"/>
<text x="1035" y="97" style="font-size:8px;fill:#555">Estacionamiento</text>
<rect x="1020" y="104" width="11" height="10" fill="#e8e3d8" stroke="#ccc" stroke-width=".5"/>
<text x="1035" y="113" style="font-size:8px;fill:#555">Área de servicio</text>
<rect x="1020" y="120" width="11" height="10" fill="#b8c9de" stroke="#ccc" stroke-width=".5"/>
<text x="1035" y="129" style="font-size:8px;fill:#555">Accesos / Escaleras</text>

<!-- Branding -->
<rect x="1010" y="200" width="144" height="52" rx="4" fill="#3a1a6e"/>
<text x="1082" y="220" style="font-size:9px;fill:#fbbd1a;text-anchor:middle;letter-spacing:3;font-weight:700">PLAZA</text>
<text x="1082" y="239" style="font-size:9px;fill:#fff;text-anchor:middle;letter-spacing:2">UNIVERSIDAD</text>
<text x="1010" y="270" style="font-size:8px;fill:#999;letter-spacing:1">ESTACIONAMIENTO NVL</text>
<text x="1010" y="284" style="font-size:7px;fill:#bbb">22 MARZO 2027</text>
</svg>
