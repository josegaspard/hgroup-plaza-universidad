<!-- PLANTA BAJA EXTERIOR / ESTACIONAMIENTO EXTERIOR — Plaza Universidad -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870"
     font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Mapa Planta Baja Exterior Plaza Universidad">
<defs>
  <style>
    .z { cursor:pointer; transition:opacity .2s,filter .2s; }
    .z:hover { opacity:.8; filter:brightness(.93); }
    .al { font-size:18px; font-weight:700; fill:#1a1a1a; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
    .sl { font-size:9px; font-weight:700; fill:#333; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
    .cl { font-size:7.5px; fill:#777; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
  </style>
</defs>

<!-- Fondo exterior -->
<rect width="1200" height="870" fill="#d0ccc0"/>
<rect x="0" y="820" width="1200" height="50" fill="#c0bdb4"/>
<text x="600" y="848" style="font-size:10px;fill:#888;text-anchor:middle;letter-spacing:3;font-weight:600">AV. UNIVERSIDAD</text>
<rect x="0" y="0" width="42" height="820" fill="#c0bdb4"/>
<rect x="1158" y="0" width="42" height="870" fill="#c0bdb4"/>

<!-- Contorno general -->
<polygon points="42,42 1158,42 1158,820 42,820" fill="#edeae0" stroke="#888" stroke-width="2"/>

