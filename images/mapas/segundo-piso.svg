<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-label="Mapa Segundo Piso Plaza Universidad">
  <defs>
    <style>
      .store-zone { cursor: pointer; transition: opacity 0.18s, filter 0.18s; }
      .store-zone:hover { opacity: 0.82; filter: brightness(0.92); }
      .anchor-lbl { font-size: 17px; font-weight: 700; fill: #2a2a2a; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
      .small-lbl  { font-size: 8.5px; font-weight: 600; fill: #333; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
      .micro-lbl  { font-size: 7px; font-weight: 600; fill: #444; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
      .cat-lbl    { font-size: 7px; fill: #888; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    </style>
